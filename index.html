<!doctype html>
<html lang="id">
  <head>
    <!-- Private routes (/lengkapi/<token>, /daftar, /cek-status, /set-password, /admin, /agent, /flyer-print):
         no third-party tag may load, the URL can hold a bearer token. Keep in sync with src/lib/privateRoutes.ts. -->
    <script>
      window.__musafarPrivate = /^\/(lengkapi|daftar|cek-status|set-password|admin|agent|flyer-print)(\/|$)/.test(location.pathname);
    </script>

    <!-- No third-party tag (GTM, Clarity, Meta Pixel, TikTok, GA4) is loaded from this file.
         They load only after the visitor agrees: src/lib/consent.ts (storage key musafar_consent),
         src/lib/trackerLoaders.ts, src/components/ConsentBanner.tsx. -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title/description/keywords/OG/Twitter/canonical are set dynamically per-route by src/components/SEO.tsx (react-helmet-async) -->
    <title>Musafar Tour - Paket Umroh Terpercaya 2026</title>
    <meta name="author" content="Musafar Tour" />
    
    <!-- Critical resource hints - establish early connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking font loading -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap"></noscript>
    <link rel="preconnect" href="https://lcpjuaxiwbdzdozitwzi.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://lcpjuaxiwbdzdozitwzi.supabase.co">

    <!-- Preload the homepage hero (the LCP image) only on the homepage; this shell serves every route. -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.fetchPriority = 'high';
        l.href = '/hero-1920.webp';
        l.setAttribute('imagesrcset', '/hero-800.webp 800w, /hero-1280.webp 1280w, /hero-1920.webp 1920w, /hero-2560.webp 2560w');
        l.setAttribute('imagesizes', '100vw');
        document.head.appendChild(l);
      }
    </script>
    
    <!-- Inline critical CSS for fastest paint -->
    <style>
      /* Reset & Base */
      *,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid}
      html{-webkit-text-size-adjust:100%;tab-size:4;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,sans-serif;line-height:1.5;scroll-behavior:smooth}
      body{margin:0;line-height:inherit;font-weight:500;}
      #root{min-height:100vh}
      
      /* Critical animations for loading states */
      .animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
      
      
      
      /* Prevent image layout shifts */
      img{max-width:100%;height:auto}
    </style>

    
    <!-- Open Graph / Facebook: type/locale/site_name are page-independent so stay static;
         url/title/description/image are set per-route by SEO.tsx -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Musafar Tour" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>

  <body>
    <!-- Skip link + navbar are portaled here (src/components/Navbar.tsx) so they come first in the focus order. -->
    <div id="nav-root"></div>
    <div id="root"></div>
    <!-- Load main script as module (defer is default for type="module") -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
